title: Data File
tabs:
  main:
    display: File
    sections:
      -
        display: Downloadable File
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: file
            field:
              type: assets
              display: File
              container: assets
              max_files: 1
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'Brief description shown beside the download.'
          -
            handle: topic
            field:
              type: select
              display: Topic
              clearable: true
              options:
                emissions: Emissions
                rainfall: Rainfall
                floods: Floods
                risk: Risk
                policy: Policy
                finance: Finance
                environment: Environment
          -
            handle: source_entry
            field:
              type: entries
              display: Source
              collections:
                - sources
              max_items: 1
  coverage:
    display: Coverage
    sections:
      -
        display: Period And Geography
        fields:
          -
            handle: geography_scope
            field:
              type: select
              display: Geography Scope
              options:
                nigeria: Nigeria
                subnational: Subnational
                global: Global
                source_defined: Source-defined coverage
          -
            handle: coverage_label
            field:
              type: text
              display: Coverage Note
              instructions: 'For example: Nigerian states, global countries, or event locations.'
          -
            handle: period_start
            field:
              type: date
              display: Period Start
          -
            handle: period_end
            field:
              type: date
              display: Period End
          -
            handle: update_frequency
            field:
              type: select
              display: Update Frequency
              clearable: true
              options:
                ad_hoc: Ad hoc
                annual: Annual
                quarterly: Quarterly
                monthly: Monthly
                dekadal: Every 10 days
  publication:
    display: Publication
    sections:
      -
        display: Availability
        fields:
          -
            handle: download_available
            field:
              type: toggle
              display: Available for Download
              default: false
          -
            handle: status
            field:
              type: select
              display: Status
              options:
                draft: Draft
                review: Ready for review
                published: Published
                archived: Archived
              default: draft
          -
            handle: notes
            field:
              type: markdown
              display: Editorial Notes
